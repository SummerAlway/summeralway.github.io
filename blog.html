<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>博客 · SummerAlway</title>
  <meta name="description" content="SummerAlway 的博客，文章来源于 GitHub posts 文件夹。">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="progress" aria-hidden="true"></div>

  <!-- ===== Nav ===== -->
  <header class="nav">
    <div class="container nav-inner">
      <a href="index.html" class="nav-logo" id="logoText">Summer<span id="logoAccent">Alway</span></a>
      <nav class="nav-links" id="navLinks">
        <a href="index.html#about">关于</a>
        <a href="index.html#projects">项目</a>
        <a href="blog.html" class="active">博客</a>
        <a href="index.html#contact">联系</a>
      </nav>
      <button class="nav-toggle" id="navToggle" aria-label="菜单">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main>

    <!-- ===== Blog ===== -->
    <section class="section reveal" id="blog">
      <div class="container">
        <h2 class="section-title" id="blogTitle">博客</h2>
        <p class="section-desc" id="blogDesc"></p>

        <div class="blog-toolbar">
          <span class="blog-source">📁 文章存放于 GitHub <code>posts/</code> 文件夹，推送即发布 · <a href="https://github.com/SummerAlway/summeralway.github.io/tree/main/posts" target="_blank" rel="noopener">前往文件夹</a></span>
          <button class="btn btn-outline" id="btnRefresh">↻ 刷新</button>
        </div>

        <div class="blog-list" id="blogList">
          <div class="empty"><span class="icon">⏳</span>正在从 GitHub 加载文章…</div>
        </div>

        <!-- 文章阅读视图 -->
        <article class="post" id="postView" hidden>
          <button class="back-btn" id="backBtn">← 返回列表</button>
          <header class="post-header">
            <h1 class="post-title" id="postTitle"></h1>
            <div class="post-meta">
              <time id="postDate"></time>
              <span class="tags" id="postTags"></span>
            </div>
          </header>
          <div class="post-content" id="postContent"></div>
        </article>
      </div>
    </section>

  </main>

  <footer class="footer">
    <div class="container">
      <p>© <span id="year"></span> <span id="footerName"></span> · Built with ♥ and Markdown · <a href="index.html">主页</a></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="js/animate.js"></script>
  <script src="js/blog.js"></script>
</body>
</html>
