<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>博客 · SummerAlway</title>
  <meta name="description" content="SummerAlway 的博客，文章来源于 GitHub posts 文件夹。">
  <link rel="stylesheet" href="css/style.css">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("mypage.theme"); } catch (e) {}
      if (!t) t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>

  <div id="progress" aria-hidden="true"></div>

  <!-- ===== Nav ===== -->
  <header class="nav">
    <div class="container nav-inner">
      <a href="index.html" class="nav-logo" id="logoText">Summer<span id="logoAccent">Alway</span></a>
      <div class="nav-right">
        <nav class="nav-links" id="navLinks">
          <a href="index.html#about">关于</a>
          <a href="index.html#projects">项目</a>
          <a href="blog.html" class="active">博客</a>
          <a href="archive.html">归档</a>
          <a href="friends.html">友链</a>
          <a href="index.html#contact">联系</a>
        </nav>
        <button class="theme-toggle" id="themeToggle" aria-label="切换日夜主题" title="切换日夜主题">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
        <button class="nav-toggle" id="navToggle" aria-label="菜单">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main>

    <!-- ===== Blog ===== -->
    <section class="section reveal" id="blog">
      <div class="container">
        <h2 class="section-title" id="blogTitle">博客</h2>
        <p class="section-desc" id="blogDesc"></p>

        <div class="blog-toolbar">
          <button class="btn btn-outline" id="btnRefresh">↻ 刷新</button>
        </div>

        <div class="blog-search">
          <div class="search-box">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="search" id="searchInput" placeholder="搜索文章标题、正文或标签…" autocomplete="off" aria-label="搜索文章">
            <button class="search-clear" id="searchClear" aria-label="清空搜索" hidden>✕</button>
          </div>
          <div class="tag-filter" id="tagFilter"></div>
          <div class="search-result-count" id="searchCount" hidden></div>
        </div>

        <div class="blog-list" id="blogList">
          <div class="empty"><span class="icon">⏳</span>正在加载文章…</div>
        </div>

        <!-- 文章阅读视图 -->
        <article class="post" id="postView" hidden>
          <header class="post-header">
            <h1 class="post-title" id="postTitle"></h1>
            <div class="post-meta">
              <time id="postDate"></time>
              <span class="tags" id="postTags"></span>
            </div>
          </header>
          <div class="post-content" id="postContent"></div>
          <nav class="post-nav" aria-label="上下篇文章">
            <a class="post-nav-item prev" id="prevPost" hidden>← 上一篇</a>
            <a class="post-nav-item next" id="nextPost" hidden>下一篇 →</a>
          </nav>
          <div class="post-bottombar">
            <button class="btn btn-outline" id="expandList">☰ 全部文章</button>
          </div>
        </article>
      </div>
    </section>

  </main>

  <footer class="footer">
    <div class="container">
      <p>© <span id="year"></span> <span id="footerName"></span> · Built with ♥ and Markdown · <a href="index.html">主页</a> · <a href="archive.html">归档</a> · <a href="friends.html">友链</a></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="js/constellation.js"></script>
  <script src="js/posts.js"></script>
  <script src="js/animate.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/blog.js"></script>
</body>
</html>
