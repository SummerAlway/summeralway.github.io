<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SummerAlway · Personal Homepage</title>
  <meta name="description" content="Personal homepage with a static blog.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== Nav ===== -->
  <header class="nav">
    <div class="container nav-inner">
      <a href="#top" class="nav-logo" id="logoText">Summer<span id="logoAccent">Alway</span></a>
      <nav class="nav-links" id="navLinks">
        <a href="#about">关于</a>
        <a href="#projects">项目</a>
        <a href="blog.html">博客</a>
        <a href="#contact">联系</a>
      </nav>
      <button class="nav-toggle" id="navToggle" aria-label="菜单">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main id="top">

    <!-- ===== Hero ===== -->
    <section class="hero">
      <div class="container">
        <p class="hero-greeting" id="heroGreeting">你好，我是</p>
        <h1 class="hero-title">
          <span id="heroName"></span><span class="type-cursor" aria-hidden="true">|</span>
        </h1>
        <p class="hero-subtitle" id="heroSubtitle"></p>
        <p class="hero-desc" id="heroDesc"></p>
        <div class="hero-actions">
          <a href="blog.html" class="btn btn-primary">阅读博客</a>
          <a href="#contact" class="btn btn-outline">联系我</a>
        </div>
      </div>
    </section>

    <!-- ===== About ===== -->
    <section class="section" id="about">
      <div class="container">
        <h2 class="section-title" id="aboutTitle">关于我</h2>
        <p class="section-desc" id="aboutDesc"></p>
        <div class="about-grid" id="aboutGrid"></div>
      </div>
    </section>

    <!-- ===== Projects ===== -->
    <section class="section section-alt" id="projects">
      <div class="container">
        <h2 class="section-title" id="projectsTitle">项目</h2>
        <p class="section-desc" id="projectsDesc"></p>
        <div class="projects-grid" id="projectsGrid"></div>
      </div>
    </section>

    <!-- ===== Contact ===== -->
    <section class="section section-alt" id="contact">
      <div class="container">
        <h2 class="section-title" id="contactTitle">联系我</h2>
        <p class="section-desc" id="contactDesc">欢迎交流与合作，期待你的来信。</p>
        <div class="contact-links" id="contactLinks"></div>
      </div>
    </section>

  </main>

  <footer class="footer">
    <div class="container">
      <p>© <span id="year"></span> <span id="footerName"></span> · Built with ♥ and Markdown · <a href="blog.html">博客</a> · <a href="admin.html">管理</a></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/cursor-effects@1.0.18/dist/browser.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
