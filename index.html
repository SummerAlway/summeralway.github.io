<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SummerAlway · Personal Homepage</title>
  <meta name="description" content="Personal homepage with a static blog.">
  <link rel="stylesheet" href="css/style.css">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("mypage.theme"); } catch (e) {}
      if (!t) t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>

  <div id="progress" aria-hidden="true"></div>

  <!-- ===== Nav ===== -->
  <header class="nav">
    <div class="container nav-inner">
      <a href="#top" class="nav-logo" id="logoText">Summer<span id="logoAccent">Alway</span></a>
      <div class="nav-right">
        <nav class="nav-links" id="navLinks">
          <a href="#about">关于</a>
          <a href="#projects">项目</a>
          <a href="blog.html">博客</a>
          <a href="friends.html">友链</a>
          <a href="#contact">联系</a>
        </nav>
        <button class="theme-toggle" id="themeToggle" aria-label="切换日夜主题" title="切换日夜主题">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
        <button class="nav-toggle" id="navToggle" aria-label="菜单">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main id="top">

    <!-- ===== Hero ===== -->
    <section class="hero">
      <div class="container">
        <p class="hero-greeting" id="heroGreeting">你好，我是</p>
        <h1 class="hero-title">
          <span id="heroName"></span>
        </h1>
        <p class="hero-subtitle" id="heroSubtitle"></p>
        <p class="hero-desc" id="heroDesc"></p>
        <div class="hero-actions">
          <a href="blog.html" class="btn btn-primary">阅读博客</a>
          <a href="#contact" class="btn btn-outline">联系我</a>
        </div>
      </div>
    </section>

    <!-- ===== About ===== -->
    <section class="section reveal" id="about">
      <div class="container">
        <h2 class="section-title" id="aboutTitle">关于我</h2>
        <p class="section-desc" id="aboutDesc"></p>
        <div class="about-grid" id="aboutGrid"></div>
      </div>
    </section>

    <!-- ===== Projects ===== -->
    <section class="section section-alt reveal" id="projects">
      <div class="container">
        <h2 class="section-title" id="projectsTitle">项目</h2>
        <p class="section-desc" id="projectsDesc"></p>
        <div class="projects-grid" id="projectsGrid"></div>
      </div>
    </section>

    <!-- ===== Contact ===== -->
    <section class="section section-alt reveal" id="contact">
      <div class="container">
        <h2 class="section-title" id="contactTitle">联系我</h2>
        <p class="section-desc" id="contactDesc">欢迎交流与合作，期待你的来信。</p>
        <div class="contact-links" id="contactLinks"></div>
      </div>
    </section>

  </main>

  <footer class="footer">
    <div class="container">
      <p>© <span id="year"></span> <span id="footerName"></span> · Built with ♥ and Markdown · <a href="blog.html">博客</a> · <a href="friends.html">友链</a></p>
    </div>
  </footer>

  <script src="js/effect.js"></script>
  <script src="js/animate.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
