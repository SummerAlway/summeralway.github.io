<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Name · Personal Homepage</title>
  <meta name="description" content="Personal homepage with a static blog.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== Nav ===== -->
  <header class="nav">
    <div class="container nav-inner">
      <a href="#top" class="nav-logo" id="logoText">Your<span id="logoAccent">Name</span></a>
      <nav class="nav-links" id="navLinks">
        <a href="#about">关于</a>
        <a href="#projects">项目</a>
        <a href="#blog">博客</a>
        <a href="#contact">联系</a>
      </nav>
      <button class="nav-toggle" id="navToggle" aria-label="菜单">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main id="top">

    <!-- ===== Hero ===== -->
    <section class="hero">
      <div class="container">
        <p class="hero-greeting" id="heroGreeting">你好，我是</p>
        <h1 class="hero-title">
          <span id="heroName"></span><span class="type-cursor" aria-hidden="true">|</span>
        </h1>
        <p class="hero-subtitle" id="heroSubtitle">前端工程师 · 独立开发者 · 终身学习者</p>
        <p class="hero-desc" id="heroDesc">
          在这里记录我的思考、项目与生活。相信简单是一种美，坚持用代码创造价值。
        </p>
        <div class="hero-actions">
          <a href="#blog" class="btn btn-primary">阅读博客</a>
          <a href="#contact" class="btn btn-outline">联系我</a>
        </div>
      </div>
    </section>

    <!-- ===== About ===== -->
    <section class="section" id="about">
      <div class="container">
        <h2 class="section-title" id="aboutTitle">关于我</h2>
        <p class="section-desc" id="aboutDesc"></p>
        <div class="about-grid" id="aboutGrid"></div>
      </div>
    </section>

    <!-- ===== Projects ===== -->
    <section class="section section-alt" id="projects">
      <div class="container">
        <h2 class="section-title" id="projectsTitle">项目</h2>
        <p class="section-desc" id="projectsDesc"></p>
        <div class="projects-grid" id="projectsGrid"></div>
      </div>
    </section>

    <!-- ===== Blog ===== -->
    <section class="section" id="blog">
      <div class="container">
        <h2 class="section-title" id="blogTitle">博客</h2>
        <p class="section-desc" id="blogDesc">上传 Markdown 文件，即可发布一篇新的博客文章。</p>

        <div class="upload-bar">
          <label class="upload-btn" for="mdInput">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            上传 Markdown
          </label>
          <input type="file" id="mdInput" accept=".md,.markdown,text/markdown" hidden>
          <button class="btn-clear" id="clearPosts">清空本地文章</button>
        </div>

        <div class="blog-list" id="blogList"></div>

        <!-- 文章阅读视图 -->
        <article class="post" id="postView" hidden>
          <button class="back-btn" id="backBtn">← 返回列表</button>
          <header class="post-header">
            <h1 class="post-title" id="postTitle"></h1>
            <div class="post-meta">
              <time id="postDate"></time>
              <span class="tags" id="postTags"></span>
            </div>
          </header>
          <div class="post-content" id="postContent"></div>
        </article>
      </div>
    </section>

    <!-- ===== Contact ===== -->
    <section class="section section-alt" id="contact">
      <div class="container">
        <h2 class="section-title" id="contactTitle">联系我</h2>
        <p class="section-desc" id="contactDesc">欢迎交流与合作，期待你的来信。</p>
        <div class="contact-links" id="contactLinks"></div>
      </div>
    </section>

  </main>

  <footer class="footer">
    <div class="container">
      <p>© <span id="year"></span> <span id="footerName">Your Name</span> · Built with ♥ and Markdown · <a href="admin.html" class="footer-admin">管理</a></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
