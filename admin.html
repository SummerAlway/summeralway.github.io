<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>站主后台 · SummerAlway</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="css/style.css">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("mypage.theme"); } catch (e) {}
      if (!t) t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>

  <div id="progress" aria-hidden="true"></div>

  <!-- ===== Nav ===== -->
  <header class="nav">
    <div class="container nav-inner">
      <a href="index.html" class="nav-logo" id="logoText">Summer<span id="logoAccent">Alway</span></a>
      <div class="nav-right">
        <nav class="nav-links" id="navLinks">
          <a href="index.html">主页</a>
          <a href="blog.html">博客</a>
          <a href="guestbook.html">留言</a>
        </nav>
        <button class="theme-toggle" id="themeToggle" aria-label="切换日夜主题" title="切换日夜主题">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
        <button class="nav-toggle" id="navToggle" aria-label="菜单">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <h2 class="section-title">站主后台</h2>
        <p class="section-desc">登录后可回复、删除留言；回复将以站主名义显示。</p>

        <!-- 登录 -->
        <div id="adminLogin" class="admin-card" hidden>
          <input type="password" id="adminPwd" class="cm-input" placeholder="后台密码" autocomplete="current-password">
          <div class="admin-actions">
            <button class="btn btn-primary" id="adminLoginBtn">登录</button>
          </div>
        </div>

        <!-- 管理面板 -->
        <div id="adminPanel" hidden>
          <div class="admin-bar">
            <span>已登录：<b id="adminOwner">站主</b></span>
            <span class="admin-bar-btns">
              <button class="btn btn-outline" id="adminRefresh">刷新</button>
              <button class="btn btn-outline" id="adminLogout">退出登录</button>
            </span>
          </div>
          <div id="adminList" class="admin-list"></div>
        </div>

        <div class="cm-status" id="adminStatus" hidden></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© <span id="year"></span> <span id="footerName"></span> · <a href="index.html">主页</a></p>
    </div>
  </footer>

  <script src="js/posts.js"></script>
  <script src="js/animate.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
